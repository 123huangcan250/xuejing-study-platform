# 每次推送到 main 或提 PR 时自动检查：后端测试 + 前端类型检查与生产构建。
# 不需要任何密钥：测试都用临时数据目录和本地假站点，不访问清华服务、不调用模型。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端测试（Windows）
    # 凭据保存用的是 Windows DPAPI，登录测试要用本机 Chrome/Edge，所以在 Windows 上跑
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: 运行测试
        run: python -m pytest -q

  frontend:
    name: 前端类型检查与构建
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: 类型检查
        run: npm run typecheck
      - name: 生产构建
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
